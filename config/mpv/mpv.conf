# Subtitle visibility and styling
sub-visibility=yes
sub-auto=fuzzy
sub-font="sans-serif"
sub-font-size=44
sub-color="#FFFFFF"
sub-border-color="#000000"
sub-border-size=3.0
sub-shadow-offset=1.5
sub-pos=95

# Preferred audio and subtitle languages
slang=en,eng,it,ita
alang=it,ita,en,eng

# Cache settings
cache=yes
demuxer-max-bytes=150MiB
